name: watchlens
description: WatchLens（腕表识图库）— 端侧抠图 + Gemini 识表 + 本地纯文字数据库
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.5

  # 相册 / 系统相机拍照
  image_picker: ^1.1.2

  # 端侧主体分割（目前仅 Android 可用，Beta）
  google_mlkit_commons: ">=0.9.0 <1.0.0"
  google_mlkit_subject_segmentation: ">=0.0.1 <1.0.0"

  # 图像处理（应用蒙版、裁剪、缩放、JPEG 压缩）与临时目录
  image: ^4.5.4
  path_provider: ^2.1.5

  # 网络与存储
  dio: ^5.9.0
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3

  # 详情页网络图临时缓存
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
