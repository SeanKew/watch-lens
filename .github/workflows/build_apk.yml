name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter 3.50's included Gradle build has no explicit pluginManagement
      # repositories, so Gradle may look for Kotlin 2.3.20 only in the plugin
      # portal. Enable Maven Central for plugin resolution in this CI runner.
      - name: Configure Flutter Gradle plugin repositories
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          settings = Path(os.environ["FLUTTER_ROOT"]) / "packages/flutter_tools/gradle/settings.gradle.kts"
          contents = settings.read_text(encoding="utf-8")
          if "pluginManagement {" not in contents:
              settings.write_text(
                  "pluginManagement {\n"
                  "    repositories {\n"
                  "        google()\n"
                  "        mavenCentral()\n"
                  "        gradlePluginPortal()\n"
                  "    }\n"
                  "}\n\n" + contents,
                  encoding="utf-8",
              )
          print(settings.read_text(encoding="utf-8").split("dependencyResolutionManagement")[0])
          PY

      # Flutter's own template supplies the matching wrapper JAR (binary).
      - name: Generate Gradle wrapper JAR
        run: |
          flutter create --platforms=android --project-name watch_lens --org com.watchlens /tmp/watch_lens_wrapper
          mkdir -p android/gradle/wrapper
          cp /tmp/watch_lens_wrapper/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-lens-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
