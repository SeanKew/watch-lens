org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Flutter and AndroidX dependencies do not require legacy support-library migration.
# Avoid JetifyTransform on large Flutter debug engine JARs (Run #12 OOM).
android.enableJetifier=false
# Some Flutter dependencies still apply the legacy Kotlin Gradle plugin.
# Keep compatibility enabled while migrating these dependencies to AGP 9.
android.builtInKotlin=false
android.newDsl=false
